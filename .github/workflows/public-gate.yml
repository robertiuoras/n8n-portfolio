name: public-gate
# Same check as the pre-push hook: no secrets and no client names anywhere in history.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan every commit
        env:
          CLIENT_NAME_DENYLIST: ${{ secrets.CLIENT_NAME_DENYLIST }}
        run: node scripts/public-gate.mjs
      - name: Gate tests
        run: node --test tests/public-gate.test.mjs
